<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bolsillo">
<meta name="theme-color" content="#EDF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bolsillo</title>
<style>
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#F3F5F1; --ink:#1C2621; --muted:#66736B; --line:#DDE3DC;
  --primary:#1E5B4F; --primary-ink:#FFFFFF; --inc:#2E7D4F; --exp:#B03A48;
  --bs:#A86E14; --bs-soft:#F5EAD3; --hero:#17463D; --ok:#22A06B; --warn:#D9831A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18201C; --surface-2:#212B26; --ink:#E4ECE6; --muted:#93A198; --line:#2A352F;
    --primary:#5DB09A; --primary-ink:#0F1512; --inc:#62C08A; --exp:#E8798A;
    --bs:#E3AD52; --bs-soft:#2D2617; --hero:#1A4239; --ok:#4CC38A; --warn:#F0A640;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1512; --surface:#18201C; --surface-2:#212B26; --ink:#E4ECE6; --muted:#93A198; --line:#2A352F;
    --primary:#5DB09A; --primary-ink:#0F1512; --inc:#62C08A; --exp:#E8798A;
    --bs:#E3AD52; --bs-soft:#2D2617; --hero:#1A4239; --ok:#4CC38A; --warn:#F0A640;
    color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#view{max-width:560px;margin:0 auto;padding:10px 16px 24px}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:10px 2px 14px}
.sec{font-size:15px;font-weight:600;color:var(--muted);margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec button{color:var(--primary);font-weight:600;font-size:15px}
.date{color:var(--muted);margin:8px 2px 12px;font-size:15px}
.amt,.big,.summary b,.hero b{font-variant-numeric:tabular-nums}

/* Saldo principal: grabado tipo billete */
.hero{color:#F2F6F1;border-radius:24px;padding:20px 20px 16px;position:relative;overflow:hidden;
  background-color:var(--hero);
  background-image:repeating-radial-gradient(circle at 108% -25%, rgba(255,255,255,.075) 0 1px, transparent 1.6px 8px);}
.hero .lbl{margin:0;opacity:.78;font-size:14px}
.hero .big{font-size:44px;font-weight:650;letter-spacing:-.035em;margin:0 0 16px;line-height:1.1}
.hero .big small{font-size:26px;opacity:.7;letter-spacing:-.02em}
.hero-row{display:flex;gap:10px}
.hero-row div{flex:1;background:rgba(255,255,255,.09);border-radius:14px;padding:8px 12px}
.hero-row span{display:block;font-size:12px;opacity:.78}
.hero-row b{font-weight:600}

.list{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-height:60px}
.list > .row:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:20px;flex:none}
.row.bs .ico{background:var(--bs-soft)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.main .t{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.amt.inc{color:var(--inc)} .amt.exp{color:var(--exp)} .amt.muted{color:var(--muted)}
.bs-head{display:flex;align-items:center;gap:8px}
.bs-tag{font-size:12px;font-weight:500;color:var(--bs);background:var(--bs-soft);border-radius:999px;padding:2px 9px}

.day{font-size:13px;color:var(--muted);margin:18px 6px 6px;display:flex;justify-content:space-between}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:3px}
.monthnav button{width:46px;height:42px;font-size:24px;color:var(--primary);line-height:1}
.monthnav b{font-weight:600}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.summary div{background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0}
.summary span{font-size:12px;color:var(--muted);display:block}
.summary b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;margin:12px 0 0}
.tools select{flex:0 0 42%}

input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px;-webkit-appearance:none;appearance:none}
input[type=date]{display:block}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px}

.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.bar i.over{background:var(--exp)}
.budget{padding:12px 14px;border-bottom:1px solid var(--line)}
.budget:last-child{border-bottom:0}
.budget .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.budget .top span:last-child{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}

.banner{background:var(--bs-soft);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;gap:12px;align-items:center;font-size:14px}
.banner p{margin:0;flex:1}
.btn{background:var(--primary);color:var(--primary-ink);border-radius:12px;padding:0 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.wide{width:100%;margin-top:10px}
.rec-actions{display:flex;gap:6px;flex:none}
.empty{text-align:center;color:var(--muted);padding:34px 20px;background:var(--surface);border-radius:18px}
.empty p{margin:0 0 12px}
.note{font-size:13px;color:var(--muted);margin:14px 6px 0}
.card{background:var(--surface);border-radius:18px;padding:14px}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;min-height:48px;justify-content:center}
.tabbar .tb.on{color:var(--primary)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .fab{flex:none;width:58px;height:58px;border-radius:19px;background:var(--primary);color:var(--primary-ink);margin:0 4px 2px;display:grid;place-items:center;transform:translateY(-8px);box-shadow:0 8px 18px rgba(23,70,61,.32)}
.tabbar .fab svg{width:28px;height:28px;stroke-width:2.4}

/* Hoja inferior */
#sheet{position:fixed;inset:0;z-index:50}
#sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#sheet.open .backdrop{opacity:1}
#sheet.open .panel{transform:none}
#sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 8px;z-index:2}
.shead h2{font-size:16px;margin:0;font-weight:600;text-align:center;flex:1}
.shead button{color:var(--primary);min-height:44px;min-width:70px;text-align:left}
.shead button.save{font-weight:700;text-align:right}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;margin:4px 0 12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:560;min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.amount{display:flex;align-items:baseline;gap:6px;background:var(--surface);border-radius:18px;padding:8px 16px}
.amount span{font-size:24px;color:var(--muted);font-weight:600}
.amount input{border:0;padding:0;font-size:40px;font-weight:650;letter-spacing:-.025em;background:transparent;min-height:60px;outline:none;font-variant-numeric:tabular-nums}
.amount.expense input{color:var(--exp)} .amount.income input{color:var(--inc)}
.flabel{font-size:13px;color:var(--muted);margin:16px 4px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-size:14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip small{opacity:.7;font-size:11px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 3px;border-radius:14px;background:var(--surface);font-size:11.5px;line-height:1.15;text-align:center;border:1.5px solid transparent;min-height:68px}
.cat span{font-size:22px}
.cat.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,var(--surface))}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px}
.fxbox{background:var(--bs-soft);border-radius:16px;padding:2px 14px 14px;margin-top:14px}
.fxbox .chips{margin:0 -14px;padding:0 14px}
.danger{width:100%;margin-top:24px;color:var(--exp);background:var(--surface);border-radius:12px;min-height:46px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:6px 4px 0}
.check{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15px}
.check input{width:22px;height:22px;min-height:0;padding:0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--primary);flex:none}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.opt.on{border-color:var(--primary)}
.opt b{display:block;font-weight:600}
.opt span{font-size:13px;color:var(--muted)}
.acc-big{text-align:center;padding:10px 0 4px}
.acc-big .ico{width:56px;height:56px;font-size:28px;margin:0 auto 8px;border-radius:18px}
.acc-big b{font-size:34px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block}
.acc-big p{margin:2px 0 0;color:var(--muted);font-size:14px}

.donutwrap{display:flex;justify-content:center;padding:6px 0 2px}
.donut{width:210px;height:210px}
.donut .c1{font-size:11px;fill:var(--muted)}
.donut .c2{font-size:17px;font-weight:650;fill:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bars{width:100%;height:auto;display:block}
.bars text{font-size:11px;fill:var(--muted)}
.bars text.cur{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.back{color:var(--primary);min-height:44px;font-size:16px;margin-top:4px}
.navrow{display:flex;justify-content:space-between;align-items:center}
.chev{color:var(--muted);font-size:20px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;min-height:0}

/* Widgets de inicio */
.w{margin-top:14px}
.w-card{background:var(--surface);border-radius:20px;padding:14px 16px}
.w-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;min-height:30px}
.w-head h3{margin:0;font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px}
.w-head .link{color:var(--primary);font-weight:600;font-size:14px;min-height:32px}
.mini{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;flex:none}
.mini button{font-size:12.5px;padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:560}
.mini button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.w-card .list{border-radius:0;margin:0 -16px}
.w-card .list .row{padding-left:16px;padding-right:16px}
.w-card .list > .row:first-child{border-top:1px solid var(--line)}
.w-text{margin:0 0 10px;font-size:14px;color:var(--muted)}
.spend{display:flex;gap:14px;align-items:center}
.spend .donut{width:132px;height:132px;flex:none}
.spend-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.spend-legend div{display:flex;align-items:center;gap:8px}
.spend-legend .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spend-legend b{font-weight:600;font-variant-numeric:tabular-nums}
.grp{border-top:1px solid var(--line)}
.grp-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;text-align:left;min-height:48px}
.grp-btn .n{flex:1;min-width:0}
.grp-items{margin:0 -16px 8px !important}
.more-btn{display:block;width:100%;color:var(--primary);font-weight:600;font-size:15px;padding:12px 0 2px;text-align:center;border-top:1px solid var(--line);margin-top:12px;min-height:44px}
.trend-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.trend-top b{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--inc)} .delta.down{color:var(--exp)} .delta.flat{color:var(--muted)}
.trend{width:100%;height:96px;display:block;margin-top:10px}
.trend-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick .cat{background:var(--surface-2)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.stats3 span{font-size:11.5px;color:var(--muted);display:block}
.stats3 b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bud{display:block;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.w-head + .bud,.budlist .bud:first-child{border-top:0;padding-top:2px}
.budlist{background:var(--surface);border-radius:18px;padding:4px 16px 6px}
.bud .top{display:flex;justify-content:space-between;gap:8px}
.bud .top b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bud .top span{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.bud .s{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.bud .s .over{color:var(--exp);font-weight:600}
.bud.done{opacity:.6}
.wrow{display:flex;align-items:center;gap:4px;background:var(--surface);padding:4px 6px 4px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow label{flex:1;display:flex;align-items:center;gap:12px;min-height:46px;font-size:15px}
.wrow input{width:22px;height:22px;min-height:0;padding:0;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--primary);flex:none}
.wrow button{width:40px;height:40px;border-radius:10px;color:var(--primary);font-size:18px}
.wrow button:disabled{color:var(--line)}
.customize{display:block;margin:22px auto 0;color:var(--primary);font-weight:600;min-height:44px;padding:0 12px}
.tagrow{display:flex;gap:8px;margin-top:8px}
.tagrow input{flex:1}
.seg.five button{font-size:13px;padding:8px 2px}
/* Categorías con grupos */
.ico.c{border-radius:50%}
.cat .cico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.cgroups{background:var(--surface);border-radius:16px;overflow:hidden}
.cgroup{border-bottom:1px solid var(--line)}
.cgroup:last-child{border-bottom:0}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;min-height:54px;text-align:left}
.crow .ico{width:36px;height:36px;border-radius:50%;font-size:18px}
.crow .n{flex:1;font-weight:540}
.crow .pick{color:var(--primary);font-size:13px;font-weight:600;white-space:nowrap}
.cgroup.sel .crow .n{color:var(--primary);font-weight:650}
.cchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px 60px}
.cgroup.multi .cchips{padding:10px 12px}
.cchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:36px;font-size:14px;background:var(--surface)}
.cchip.on{background:var(--c);border-color:var(--c);color:#fff}
.subrow{padding-left:34px !important}
.subrow .ico{width:32px;height:32px;font-size:16px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}

/* Presupuestos con estado */
.bbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:8px}
.bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bbar.ok .cur{background:var(--ok)} .bbar.ok .proj{background:color-mix(in srgb,var(--ok) 32%,transparent)}
.bbar.risk .cur{background:var(--warn)} .bbar.risk .proj{background:color-mix(in srgb,var(--warn) 32%,transparent)}
.bbar.over .cur{background:var(--exp)}
.bud .top{flex-wrap:wrap}
.lv-risk{color:var(--warn) !important;font-weight:600}
.lv-over{color:var(--exp) !important;font-weight:600}
.bigbar .bbar{height:14px;border-radius:7px;margin-top:12px}
.insight{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.brk{display:flex;align-items:center;gap:10px;padding:8px 0}
.brk .main{gap:4px}
.brk .bar{margin-top:0}
.brk .amt{min-width:80px}

/* Objetivos */
.goal{display:block;width:100%;background:var(--surface);border-radius:20px;padding:18px 16px 14px;text-align:center;margin-top:12px}
.goal.flat{background:var(--surface-2);margin-top:10px}
.w-head + .goal.flat{margin-top:0}
.gico{width:56px;height:56px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:26px;margin:0 auto 8px}
.gname{display:block;font-size:18px;font-weight:650}
.gdate{display:block;color:var(--muted);font-size:14px;margin-top:2px}

<body>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uidN = 0;
const uid = () => Date.now().toString(36) + (uidN++).toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MONTHS_S = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const monthLabel = mk => { const [y, m] = mk.split('-').map(Number); return cap(MONTHS[m - 1]) + ' ' + y; };
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); return ymd(new Date(y, m - 1 + n, 1)).slice(0, 7); };
function dayLabel(s) {
  if (s === today()) return 'Hoy';
  if (s === addDays(today(), -1)) return 'Ayer';
  const d = parseYmd(s);
  return cap(DAYS[d.getDay()]) + ' ' + d.getDate() + ' de ' + MONTHS[d.getMonth()];
}
const shortDate = s => { const d = parseYmd(s); return d.getDate() + ' ' + MONTHS_S[d.getMonth()]; };

const nf = new Intl.NumberFormat('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfRate = new Intl.NumberFormat('es-VE', { maximumFractionDigits: 4 });
function money(n, cur = 'USD', signed = false) {
  n = Math.round((n || 0) * 100) / 100;
  const sign = n < 0 ? '−' : (signed && n > 0 ? '+' : '');
  return sign + (cur === 'USD' ? '$' : 'Bs ') + nf.format(Math.abs(n));
}
function parseAmt(v, dec = 2) {
  if (typeof v === 'number') return v;
  let s = String(v || '').replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (s.includes(',')) {
    s = s.replace(/,/g, '.');
    const parts = s.split('.'); if (parts.length > 2) s = parts.slice(0, -1).join('') + '.' + parts.at(-1);
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) {
    s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  const f = Math.pow(10, dec);
  return isFinite(n) ? Math.round(n * f) / f : NaN;
}
const fmtIn = n => (n === undefined || n === null || n === '') ? '' : String(n).replace('.', ',');
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- datos ---------- */
const CAT_ICONS = ['🛒','🍔','🚗','🏠','💡','💊','📺','👕','🎉','📚','🎁','📦','💱','💼','💻','🏷️','💰','🐶','✈️','☕','📱','💇','🏋️','⛽','🧾','👶','🍷','🔧','🧴','🚌'];
const ACC_ICONS = ['💵','🪙','🏦','💳','👛','📱','💶','🐷','💼'];
const PALETTE = ['#1E5B4F','#C9822B','#3C6E9E','#A8475A','#6B8F3A','#7D5BA6','#2F8F8A','#B5653A','#5A6B7D','#9C8A2E','#486B54','#8A4F7D'];

const WIDGETS = [
  ['saldo', 'Saldo en dólares'], ['pendientes', 'Pagos pendientes'], ['rapido', 'Registro rápido'],
  ['gastos', 'Gastos del mes'], ['presupuestos', 'Presupuestos activos'], ['objetivos', 'Objetivos de ahorro'], ['deudas', 'Deudas'], ['tendencia', 'Tendencia del saldo'],
  ['flujo', 'Ritmo del mes'], ['cuentas', 'Cuentas en dólares'], ['bolivares', 'Bolívares'],
  ['divisas', 'Venta de divisas'], ['ultimos', 'Últimos registros'],
];
const WNAME = Object.fromEntries(WIDGETS);
const WIDGET_OFF = ['rapido', 'flujo', 'divisas'];
const defaultWidgets = () => WIDGETS.map(([id]) => ({ id, on: !WIDGET_OFF.includes(id) }));
const PERIODS = { once: 'Único', weekly: 'Semanal', monthly: 'Mensual', yearly: 'Anual', custom: 'Personalizado' };

// Plantilla al estilo Wallet: grupos con subcategorías
const TEMPLATE = [
  ['expense', 'Comida y bebida', '🍽️', '#E8572A', [['Mercado', '🛒'], ['Restaurantes', '🍔'], ['Café y meriendas', '☕'], ['Delivery', '🛵'], ['Licores', '🍷']]],
  ['expense', 'Compras', '🛍️', '#2E9FD6', [['Ropa y calzado', '👕'], ['Electrónica', '📱'], ['Hogar', '🛋️'], ['Cuidado personal', '🧴'], ['Farmacia', '💊'], ['Regalos', '🎁'], ['Mascotas', '🐶'], ['Niños', '👶']]],
  ['expense', 'Vivienda', '🏠', '#E8962B', [['Alquiler', '🔑'], ['Condominio', '🏢'], ['Luz, agua y gas', '💡'], ['Mantenimiento', '🔧'], ['Servicio doméstico', '🧹']]],
  ['expense', 'Transporte', '🚌', '#6F7F8C', [['Transporte público', '🚇'], ['Taxi y apps', '🚕'], ['Viajes largos', '✈️']]],
  ['expense', 'Vehículo', '🚗', '#8E44C9', [['Gasolina', '⛽'], ['Mantenimiento del carro', '🛠️'], ['Repuestos', '⚙️'], ['Estacionamiento', '🅿️'], ['Seguro del carro', '🛡️']]],
  ['expense', 'Vida y entretenimiento', '🎉', '#43A047', [['Salud', '🩺'], ['Deporte', '🏋️'], ['Ocio y salidas', '🎬'], ['Suscripciones', '📺'], ['Educación', '📚'], ['Vacaciones', '🏖️'], ['Belleza', '💇']]],
  ['expense', 'Comunicaciones', '📡', '#4C6FD9', [['Teléfono', '📞'], ['Internet', '🌐'], ['Apps y software', '💻']]],
  ['expense', 'Gastos financieros', '🏦', '#1F9E8F', [['Venta de divisas', '💱', { fx: true }], ['Comisiones', '🧾'], ['Impuestos', '📄'], ['Préstamos y deudas', '💳'], ['Seguros', '☂️']]],
  ['expense', 'Inversiones', '📈', '#D9468F', []],
  ['expense', 'Otros gastos', '📦', '#8A8F94', []],
  ['income', 'Salario', '💼', '#D4A017', []],
  ['income', 'Trabajos extra', '💻', '#C77B1E', []],
  ['income', 'Ventas', '🏷️', '#7A9A2E', []],
  ['income', 'Regalos recibidos', '🎁', '#B5487A', []],
  ['income', 'Intereses y rendimientos', '📈', '#2F8F8A', []],
  ['income', 'Reembolsos', '↩️', '#5A6B7D', []],
  ['income', 'Otros ingresos', '💰', '#9C8A2E', []],
];
const CAT_COLORS = ['#E8572A', '#2E9FD6', '#E8962B', '#6F7F8C', '#8E44C9', '#43A047', '#4C6FD9', '#1F9E8F', '#D9468F', '#D4A017', '#C77B1E', '#7A9A2E', '#B5487A', '#8A8F94'];
function templateCats() {
  const out = [];
  for (const [type, name, icon, color, subs] of TEMPLATE) {
    const g = { id: uid(), name, icon, color, type, parentId: null, hidden: false, budget: 0 };
    out.push(g);
    for (const [sn, si, sx] of subs) out.push({ id: uid(), name: sn, icon: si, color: null, type, parentId: g.id, hidden: false, budget: 0, ...(sx || {}) });
  }
  return out;
}

function defaults() {
  const c = (name, icon, type, extra = {}) => ({ id: uid(), name, icon, type, budget: 0, hidden: false, ...extra });
  return {
    version: 1,
    accounts: [
      { id: uid(), name: 'Efectivo', currency: 'USD', icon: '💵', initial: 0, archived: false },
      { id: uid(), name: 'Binance', currency: 'USD', icon: '🪙', initial: 0, archived: false },
      { id: uid(), name: 'Banco', currency: 'VES', icon: '🏦', initial: 0, archived: false },
    ],
    categories: templateCats(),
    tx: [], recurring: [], budgets: [], tags: [], goals: [], debts: [],
    settings: { lastBackup: null, widgets: defaultWidgets() },
  };
}
function migrate(s) {
  const d = defaults();
  s.accounts = Array.isArray(s.accounts) ? s.accounts : d.accounts;
  s.categories = Array.isArray(s.categories) && s.categories.length ? s.categories : d.categories;
  s.tx = Array.isArray(s.tx) ? s.tx : [];
  s.recurring = Array.isArray(s.recurring) ? s.recurring : [];
  s.settings = s.settings || { lastBackup: null };
  s.budgets = Array.isArray(s.budgets) ? s.budgets : [];
  s.tags = Array.isArray(s.tags) ? s.tags : [];
  s.goals = Array.isArray(s.goals) ? s.goals : [];
  s.debts = Array.isArray(s.debts) ? s.debts : [];
  s.categories.forEach((c, i) => { if (c.parentId === undefined) c.parentId = null; if (!c.parentId && !c.color) c.color = CAT_COLORS[i % CAT_COLORS.length]; });
  // Presupuestos antiguos (por categoría) pasan a presupuestos mensuales
  s.categories.forEach(c => {
    if (c.budget > 0) { s.budgets.push({ id: uid(), name: c.name, amount: c.budget, period: 'monthly', start: today(), categoryIds: [c.id], tags: [] }); }
    c.budget = 0;
  });
  const known = WIDGETS.map(w => w[0]);
  const ws = Array.isArray(s.settings.widgets) ? s.settings.widgets.filter(w => known.includes(w.id)) : [];
  known.forEach(id => { if (!ws.some(w => w.id === id)) ws.push({ id, on: !WIDGET_OFF.includes(id) }); });
  s.settings.widgets = ws;
  s.version = 2;
  return s;
}

const DB_NAME = 'bolsillo', STORE = 'kv';
let dbPromise = null;
function idb() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function load() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const q = db.transaction(STORE).objectStore(STORE).get('state');
      q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error);
    });
  } catch (e) {
    try { const s = localStorage.getItem('bolsillo-state'); return s ? JSON.parse(s) : null; } catch (_) { return null; }
  }
}
async function save() {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const t = db.transaction(STORE, 'readwrite');
      t.objectStore(STORE).put(JSON.parse(JSON.stringify(state)), 'state');
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  } catch (e) {
    try { localStorage.setItem('bolsillo-state', JSON.stringify(state)); }
    catch (_) { toast('No se pudo guardar. Exporta un respaldo.'); }
  }
}

let state = null;
const ui = { tab: 'home', sub: null, month: today().slice(0, 7), filterAcc: 'all', q: '', repType: 'expense', spendMode: 'cat', spendAll: false, spendOpen: null, trendRange: '30', budTab: 'periodic', budMore: {}, debtTab: 'active' };
let draft = null, sheetRender = null;

const acc = id => state.accounts.find(a => a.id === id);
const cat = id => state.categories.find(c => c.id === id);
const isUSD = id => acc(id)?.currency === 'USD';
const hasTx = accId => state.tx.some(t => t.accountId === accId || t.toAccountId === accId) || state.recurring.some(r => r.accountId === accId);
const catUsed = id => state.tx.some(t => t.categoryId === id) || state.recurring.some(r => r.categoryId === id);
const catTop = c => (c && c.parentId && cat(c.parentId)) || c;
const catColor = c => (c && (c.color || cat(c.parentId)?.color)) || '#8A8F94';
const icoBg = c => `background:color-mix(in srgb, ${catColor(c)} 22%, var(--surface))`;
const fmtDate = s => { const d = parseYmd(s); return d.getDate() + ' ' + MONTHS_S[d.getMonth()] + ' ' + d.getFullYear(); };
function frequentCats(type, n) {
  const since = addDays(today(), -120), cnt = {};
  state.tx.forEach(t => { if (t.type === type && t.categoryId && t.date >= since) cnt[t.categoryId] = (cnt[t.categoryId] || 0) + 1; });
  return Object.keys(cnt).map(cat).filter(c => c && !c.hidden).sort((a, b) => cnt[b.id] - cnt[a.id]).slice(0, n);
}

function balances() {
  const b = {};
  state.accounts.forEach(a => b[a.id] = +a.initial || 0);
  for (const t of state.tx) {
    if (!(t.accountId in b)) continue;
    if (t.type === 'expense') b[t.accountId] -= t.amount;
    else if (t.type === 'income') b[t.accountId] += t.amount;
    else if (t.type === 'adjust') b[t.accountId] += t.amount;
    else if (t.type === 'transfer') { b[t.accountId] -= t.amount; if (t.toAccountId in b) b[t.toAccountId] += t.amount; }
  }
  return b;
}
// Solo gastos e ingresos de cuentas en dólares cuentan para reportes
function monthStats(mk) {
  let inc = 0, exp = 0; const byCat = {};
  for (const t of state.tx) {
    if (t.date.slice(0, 7) !== mk || (t.type !== 'income' && t.type !== 'expense') || !isUSD(t.accountId)) continue;
    if (t.type === 'income') inc += t.amount; else exp += t.amount;
    const k = t.type + ':' + (t.categoryId || 'none');
    byCat[k] = (byCat[k] || 0) + t.amount;
  }
  return { inc, exp, byCat };
}
function nextDate(s, freq, day) {
  const d = parseYmd(s);
  if (freq === 'weekly') { d.setDate(d.getDate() + 7); return ymd(d); }
  if (freq === 'yearly') { const y = d.getFullYear() + 1, m = d.getMonth(); return ymd(new Date(y, m, Math.min(day || d.getDate(), new Date(y, m + 1, 0).getDate()))); }
  let y = d.getFullYear(), m = d.getMonth() + 1; if (m > 11) { m = 0; y++; }
  return ymd(new Date(y, m, Math.min(day || d.getDate(), new Date(y, m + 1, 0).getDate())));
}
const advanceRec = r => { r.next = nextDate(r.next, r.freq, r.day); };

/* ---------- piezas de interfaz ---------- */
function txRow(t) {
  const a = acc(t.accountId); const cur = a?.currency || 'USD';
  let icon, title, amt, cls, ist = ''; const sub = [];
  if (t.type === 'transfer') {
    icon = '↔️'; title = 'Transferencia'; sub.push((a?.name || '?') + ' a ' + (acc(t.toAccountId)?.name || '?'));
    amt = money(t.amount, cur); cls = 'muted';
  } else if (t.type === 'adjust') {
    icon = '⚖️'; title = 'Ajuste de saldo'; sub.push(a?.name || '');
    amt = money(t.amount, cur, true); cls = t.amount < 0 ? 'exp' : 'inc';
  } else {
    const c = cat(t.categoryId);
    if (t.fx && !c) { icon = '💱'; title = 'Cambio de divisas'; } else { icon = c?.icon || '•'; title = c?.name || 'Sin categoría'; ist = c ? icoBg(c) : ''; }
    sub.push(a?.name || '');
    amt = money(t.type === 'expense' ? -t.amount : t.amount, cur, true); cls = t.type === 'expense' ? 'exp' : 'inc';
  }
  if (t.note) sub.push(t.note);
  if (t.tags?.length) sub.push(t.tags.map(g => '#' + g).join(' '));
  if (t.rate) sub.push('tasa ' + nfRate.format(t.rate));
  return `<button class="row${cur === 'VES' ? ' bs' : ''}" data-act="editTx" data-id="${t.id}">
<span class="ico${ist ? ' c' : ''}" style="${ist}">${icon}</span>
    <span class="main"><span class="t">${esc(title)}</span><span class="s">${esc(sub.filter(Boolean).join(', '))}</span></span>
    <span class="amt ${cls}">${amt}</span></button>`;
}
function accRow(a, bal) {
  return `<button class="row${a.currency === 'VES' ? ' bs' : ''}" data-act="accDetail" data-id="${a.id}">
    <span class="ico">${a.icon}</span>
    <span class="main"><span class="t">${esc(a.name)}</span></span>
    <span class="amt${bal < 0 ? ' exp' : ''}">${money(bal, a.currency)}</span></button>`;
}
const monthNav = () => `<div class="monthnav"><button data-act="month" data-n="-1" aria-label="Mes anterior">‹</button><b>${monthLabel(ui.month)}</b><button data-act="month" data-n="1" aria-label="Mes siguiente">›</button></div>`;
const sortTx = list => list.sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
function bigMoney(n) {
  const s = money(n); const i = s.lastIndexOf(',');
  return esc(s.slice(0, i)) + '<small>' + esc(s.slice(i)) + '</small>';
}

/* ---------- vistas ---------- */
function vHome() {
  const d = new Date();
  const ctx = { b: balances(), st: monthStats(today().slice(0, 7)), d };
  let h = `<p class="date">${cap(DAYS[d.getDay()])} ${d.getDate()} de ${MONTHS[d.getMonth()]}</p>`;
  const lb = state.settings.lastBackup;
  const since = lb ? daysBetween(lb, today()) : null;
  if (state.tx.length >= 5 && (since === null || since >= 30)) {
    h += `<div class="banner" style="margin:0 0 4px"><p>${since === null ? 'Aún no has guardado un respaldo de tus registros.' : `Tu último respaldo fue hace ${since} días.`}</p><button class="btn sm" data-act="exportJSON">Respaldar</button></div>`;
  }
  for (const w of state.settings.widgets) {
    if (!w.on || !W[w.id]) continue;
    const html = W[w.id](ctx);
    if (html) h += `<section class="w">${html}</section>`;
  }
  return h + `<button class="customize" data-act="customize">Personalizar inicio</button>`;
}
const card = (title, right, body) => `<div class="w-card"><div class="w-head"><h3>${title}</h3>${right || ''}</div>${body}</div>`;
const mini = (act, opts, val) => `<div class="mini">${opts.map(([v, l]) => `<button class="${val === v ? 'on' : ''}" data-act="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
const wlink = (act, label, v = '') => `<button class="link" data-act="${act}" data-v="${v}">${label}</button>`;

function spendGroups(mk, mode) {
  const map = new Map();
  for (const t of state.tx) {

      const pct = total ? x.v / total * 100 : 0;
      return `<button class="row" data-act="catMoves" data-id="${x.c.id}"><span class="dot" style="background:${x.color}"></span><span class="ico c" style="${icoBg(x.c)}">${x.c.icon}</span>
        <span class="main"><span class="t">${esc(x.c.name)}</span><span class="s">${pct.toFixed(1).replace('.', ',')}%${x.subs.length ? ', ' + esc(x.subs.sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, v]) => n + ' ' + money(v)).join(', ')) : ''}</span></span>
        <span class="amt">${money(x.v)}</span></button>`;
    }).join('') + `</div>`;
  } else {
    h += `<div class="empty"><p>No hay ${type === 'expense' ? 'gastos' : 'ingresos'} en dólares este mes.</p></div>`;
  }
  h += `<h2 class="sec">Últimos 6 meses</h2><div class="card">${bars(mk)}<div class="legend"><span><i class="dot" style="background:var(--inc)"></i>Ingresos</span><span><i class="dot" style="background:var(--exp)"></i>Gastos</span></div></div>
    <p class="note">Solo se cuentan las cuentas en dólares. Las transferencias, los ajustes de saldo y los bolívares no entran en los reportes.</p>`;
  return h;
}
function donut(items, total, label, shown = total) {
  const r = 70, C = 2 * Math.PI * r; let off = 0, segs = '';
  items.forEach(it => {
    const len = it.v / total * C;
    segs += `<circle r="${r}" cx="100" cy="100" fill="none" stroke="${it.color}" stroke-width="26" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)"/>`;
    off += len;
  });
  return `<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="Distribución por categoría">${segs}
    <text x="100" y="94" text-anchor="middle" class="c1">${label}</text>
    <text x="100" y="116" text-anchor="middle" class="c2">${money(shown)}</text></svg>`;
}
function bars(mk) {
  const data = []; for (let i = 5; i >= 0; i--) { const m = shiftMonth(mk, -i); data.push({ m, ...monthStats(m) }); }
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const W = 330, H = 160, top = 8, base = H - 22, gap = W / 6, bw = 15;
  let s = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  data.forEach((d, i) => {
    const x = i * gap + gap / 2, hi = d.inc / max * (base - top), he = d.exp / max * (base - top);
    s += `<rect x="${(x - bw - 1).toFixed(1)}" y="${(base - hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" rx="3" fill="var(--inc)"/>
      <rect x="${(x + 1).toFixed(1)}" y="${(base - he).toFixed(1)}" width="${bw}" height="${he.toFixed(1)}" rx="3" fill="var(--exp)"/>
      <text x="${x.toFixed(1)}" y="${H - 5}" text-anchor="middle" class="${d.m === mk ? 'cur' : ''}">${MONTHS_S[+d.m.slice(5) - 1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="bars" role="img" aria-label="Ingresos y gastos de los últimos seis meses">${s}</svg>`;
}

  [...groups.entries()].sort((a, b) => b[1].reduce((s, d) => s + debtLeft(d), 0) - a[1].reduce((s, d) => s + debtLeft(d), 0)).forEach(([lender, ds]) => {

}

function catPicker(k, type, val, multi = false) {
  const d = draft;

  const cchip = (c, label) => { const on = sel.has(c.id) || (multi && c.parentId && sel.has(c.parentId)); return `<button type="button" class="cchip ${on ? 'on' : ''}" style="--c:${catColor(c)}" data-act="${act}" data-k="${k}" data-v="${c.id}">${c.icon} ${esc(label || c.name)}</button>`; };

function openTx(t, preset = {}) {
  if (t) {
    draft = { ...t, amount: fmtIn(t.amount), rate: t.rate ? fmtIn(t.rate) : '', fxAccountId: '', fxAmount: '', tags: [...(t.tags || [])], newTag: '' };
    if (t.linkId) { const l = state.tx.find(x => x.id === t.linkId); if (l) { draft.fxAccountId = l.accountId; draft.fxAmount = fmtIn(l.amount); } }
  } else {

/* Respaldo */
async function shareOrDownload(text, name, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
async function exportJSON() {
  const data = JSON.stringify({ app: 'bolsillo', exportedAt: new Date().toISOString(), ...state });
  const ok = await shareOrDownload(data, `bolsillo-respaldo-${today()}.json`, 'application/json');
  if (ok) { state.settings.lastBackup = today(); save(); render(); toast('Respaldo listo'); }
}
function exportCSV() {
  const tl = { expense: 'gasto', income: 'ingreso', transfer: 'transferencia', adjust: 'ajuste' };
  const rows = [['fecha', 'tipo', 'cuenta', 'moneda', 'monto', 'categoria', 'cuenta_destino', 'nota', 'tasa', 'etiquetas']];
  [...state.tx].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => {
    const a = acc(t.accountId);
    rows.push([t.date, tl[t.type], a?.name || '', a?.currency || '', t.type === 'expense' ? -t.amount : t.amount,
      t.fx && !t.categoryId ? 'Cambio de divisas' : (cat(t.categoryId)?.name || ''), acc(t.toAccountId)?.name || '', t.note || '', t.rate || '', (t.tags || []).join(' ')]);
  });
  const csv = rows.map(r => r.map(v => { const s = String(v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  shareOrDownload('\ufeff' + csv, `bolsillo-${today()}.csv`, 'text/csv');
}

  quick: el => openTx(null, { categoryId: el.dataset.id }),
  quickInc: () => openTx(null, { type: 'income' }),
  delAdjust: () => { if (!confirm('¿Eliminar este ajuste? El saldo volverá a como estaba.')) return; state.tx = state.tx.filter(t => t.id !== draft.id); save(); closeSheet(); render(); },
};
function openAdjustRecord(t) {
  draft = { id: t.id }; const a = acc(t.accountId);
  openSheet(() => sheetHead('Ajuste de saldo', null) + `<div class="acc-big"><div class="ico">⚖️</div><p>${esc(a?.name || '')}, ${dayLabel(t.date).toLowerCase()}</p><b class="amt ${t.amount < 0 ? 'exp' : 'inc'}">${money(t.amount, a?.currency, true)}</b></div>
    <p class="hint" style="text-align:center">Los ajustes corrigen el saldo y no entran en los reportes.</p><button class="danger" data-act="delAdjust">Eliminar ajuste</button>`);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = actions[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  if (draft?._kind === 'debt' && e.target.closest('#sheet-body')) { const pv = $('#debt-preview'); if (pv) { syncDraft(); pv.innerHTML = debtPreview(draft); } }
  if (e.target.id === 'q') {
    ui.q = e.target.value;
    $('#moves-list').innerHTML = movesList();
    $('#mnav').innerHTML = ui.q ? '' : monthNav();
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'filterAcc') { ui.filterAcc = e.target.value; $('#moves-list').innerHTML = movesList(); }
  if (e.target.id === 'importFile') {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.accounts) || !Array.isArray(data.tx)) throw new Error('formato');
      if (!confirm(`Este respaldo tiene ${data.tx.length} movimientos. Reemplazará todos los datos de este teléfono. ¿Continuar?`)) return;
      const { app, exportedAt, ...rest } = data; state = migrate(rest);
      await save(); ui.filterAcc = 'all'; render(); toast('Respaldo restaurado');
    } catch (_) { toast('Ese archivo no es un respaldo de Bolsillo.'); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- apariencia ---------- */
function applyTheme() {
  const t = state?.settings?.theme || 'auto', root = document.documentElement;
  if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
  try { localStorage.setItem('bolsillo-theme', t); } catch (_) {}
  const metas = document.querySelectorAll('meta[name="theme-color"]');
  metas.forEach(m => { const isDarkMeta = (m.media || '').includes('dark'); m.content = t === 'auto' ? (isDarkMeta ? '#0F1512' : '#EDF0EB') : (t === 'dark' ? '#0F1512' : '#EDF0EB'); });
}

/* ---------- inicio ---------- */
(async () => {
  const s = await load();
  state = s && s.accounts ? migrate(s) : defaults();
  applyTheme();
  if (!s) save();
  render();
  try { navigator.storage?.persist?.(); } catch (_) {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
</body>
